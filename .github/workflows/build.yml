name: NanoSharp

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: NanoSharp
      run: go build -o NanoSharp main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NanoSharp
        path: nanosharp
